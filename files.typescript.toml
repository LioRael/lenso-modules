schema_version=1
[modules.files]
version="0.1.0"
[modules.files.supports]
language=["typescript"]
runtime=["node26"]
app_host=["lenso-http-v2"]
[modules.files.options.max_bytes]
prompt="Maximum upload bytes"
kind={type="integer",min=1,max=1073741824}
default=52428800
[modules.files.slots.metadata]
contract="lenso.files-metadata"
version="^1"
[modules.files.slots.content]
contract="lenso.blob-store"
version="^1"
[modules.sqlite]
version="0.1.0"
provides={"lenso.files-metadata"={version="1.0.0"}}
[modules.sqlite.options.path]
prompt="Files SQLite database path"
kind={type="text"}
default="files.sqlite"
[modules.postgres]
version="0.1.0"
provides={"lenso.files-metadata"={version="1.0.0"}}
[modules.postgres.options.connection]
prompt="Files PostgreSQL environment binding"
kind={type="environment"}
default={env="DATABASE_URL"}
[modules.local]
version="0.1.0"
provides={"lenso.blob-store"={version="1.0.0"}}
[modules.local.options.directory]
prompt="Local content directory"
kind={type="text"}
default="data/files"
[resources]
files=[{path="typescript/src/modules/files/core.ts",target="core.ts"}]
local=[{path="typescript/src/modules/files/local.ts",target="local.ts"}]
sqlite=[{path="typescript/src/modules/files/sqlite.ts",target="store.ts"},{path="typescript/src/modules/files/sqlite-schema.ts",target="sqlite-schema.ts"}]
postgres=[{path="typescript/src/modules/files/postgres.ts",target="store.ts"},{path="typescript/src/modules/files/postgres-schema.ts",target="postgres-schema.ts"}]
[generator]
schema_version=1
directory="generated/files"
files=[{scope="composition",template="templates/typescript/files.ts.j2",target="host.ts"},{scope="composition",template="templates/files-host.toml.j2",target="host.toml"}]
[samples.default]
instances={files="files"}
bindings={"files.metadata"={type="module",module="sqlite"}}
context={language="typescript",runtime="node26",app_host="lenso-http-v2"}
[samples.postgres]
instances={files="files"}
bindings={"files.metadata"={type="module",module="postgres"}}
context={language="typescript",runtime="node26",app_host="lenso-http-v2"}

[[generator.dependencies]]
ecosystem="npm"
package="@lenso/app"
version="0.1.1"
module="files"
options={}

[[generator.dependencies]]
ecosystem="npm"
package="@types/node"
version="^26"
module="files"
options={section="devDependencies"}

[[generator.dependencies]]
ecosystem="npm"
package="pg"
version="^8.16"
module="postgres"
options={}

[[generator.dependencies]]
ecosystem="npm"
package="@types/pg"
version="^8.15"
module="postgres"
options={section="devDependencies"}
