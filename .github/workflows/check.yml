name: Check Auth modules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: python3 scripts/catalogs.py && git diff --exit-code
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt,clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo check --locked --manifest-path rust/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo doc --locked --manifest-path rust/Cargo.toml --no-deps
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci && npm run build
      - run: cargo build --locked --release --manifest-path rust/Cargo.toml --bin auth-server
      - run: npm run test:integration
