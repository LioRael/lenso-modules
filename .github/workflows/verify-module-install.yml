name: Verify Code module installation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'auth.*.toml'
      - 'files.*.toml'
      - 'contracts/files/**'
      - 'scripts/files-catalogs.py'
      - 'lenso.modules.toml'
      - 'templates/**'
      - 'scripts/verify-module-cli.py'
      - '.github/workflows/verify-module-install.yml'
permissions:
  contents: read
jobs:
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, rust]
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: LioRael/lenso-cli
          ref: 55f55cdfa376b2cdea2ddc40c05a5cd04077024d
          path: dist/cli-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Read expected module release identities
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, tomllib
          modules = tomllib.loads(pathlib.Path('lenso.modules.toml').read_text())['modules']
          auth, files = [modules[name]['releases'][-1] for name in ('auth', 'files')]
          assert auth['reference'] == files['reference']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"AUTH_MODULE_VERSION={auth['version']}\nFILES_MODULE_VERSION={files['version']}\nMODULE_SOURCE_REF={auth['reference']}\n")
          PYTHON
      - name: Start disposable PostgreSQL 18
        run: bash scripts/ci-postgres.sh
      - name: Install published CLI
        run: |
          curl -fsSL --retry 2 https://github.com/LioRael/lenso-cli/releases/download/v1.0.0/install.sh -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh" --prefix "$RUNNER_TEMP/bin"
      - name: Build reviewed App and Code sources for PR consumers
        if: github.event_name == 'pull_request'
        working-directory: dist/cli-source
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          for id in code app; do
            cargo +1.99.0 build --locked --release --target wasm32-unknown-unknown --manifest-path "extensions/$id/Cargo.toml"
            mkdir -p "dist/author/$id"
            cp "presets/$id/extension.toml" "dist/author/$id/extension.toml"
            cp "extensions/$id/target/wasm32-unknown-unknown/release/lenso_${id}.wasm" "dist/author/$id/$id.wasm"
            "$RUNNER_TEMP/bin/lenso" package --id "$id" --out "dist/mainline/$id" --json
          done
      - name: Consume Code and Auth modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          npm ci
          source=(--official)
          app_source=(--official)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            source=(--code-source "$GITHUB_WORKSPACE/dist/cli-source/dist/author/code/extension.toml")
            app_source=(--modules "$GITHUB_WORKSPACE")
          fi
          for storage in sqlite postgres; do
            python3 scripts/verify-module-cli.py --binary "$RUNNER_TEMP/bin/lenso" "${source[@]}" --token-env GITHUB_TOKEN --language "$LANGUAGE" --storage "$storage" --out "$RUNNER_TEMP/consumers/$LANGUAGE-$storage"
          done
          python3 dist/cli-source/scripts/verify-app.py --binary "$RUNNER_TEMP/bin/lenso" \
            "${app_source[@]}" --token-env GITHUB_TOKEN --language "$LANGUAGE" --storage both --auth-version "$AUTH_MODULE_VERSION" --out "$RUNNER_TEMP/apps"
      - name: Verify Files and reviewed legacy host upgrades
        if: github.event_name == 'pull_request'
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          python3 dist/cli-source/scripts/verify-files.py --binary "$RUNNER_TEMP/bin/lenso" \
            --modules "$GITHUB_WORKSPACE" --language "$LANGUAGE" --storage both --code-version 0.3.7 --auth-version "$AUTH_MODULE_VERSION" --files-version "$FILES_MODULE_VERSION" --module-ref "$MODULE_SOURCE_REF" --expect-input-issues --out "$RUNNER_TEMP/files"
          mkdir -p "$RUNNER_TEMP/legacy-app"
          curl -fsSL --retry 2 https://github.com/LioRael/lenso-cli/releases/download/app-v0.1.0/lenso-app-0.1.0.tar.gz -o "$RUNNER_TEMP/legacy-app.tar.gz"
          tar -xzf "$RUNNER_TEMP/legacy-app.tar.gz" -C "$RUNNER_TEMP/legacy-app"
          python3 dist/cli-source/scripts/verify-files.py --binary "$RUNNER_TEMP/bin/lenso" \
            --modules "$GITHUB_WORKSPACE" --language "$LANGUAGE" --storage both --code-version 0.3.7 --auth-version "$AUTH_MODULE_VERSION" --files-version "$FILES_MODULE_VERSION" --module-ref "$MODULE_SOURCE_REF" --expect-input-issues --legacy-app "$RUNNER_TEMP/legacy-app" --out "$RUNNER_TEMP/files-upgrade"
      - name: Verify official Files installations and old-version upgrades
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          python3 dist/cli-source/scripts/verify-files.py --binary "$RUNNER_TEMP/bin/lenso" \
            --official --token-env GITHUB_TOKEN --language "$LANGUAGE" --storage both --code-version 0.3.7 --auth-version "$AUTH_MODULE_VERSION" --files-version "$FILES_MODULE_VERSION" --module-ref "$MODULE_SOURCE_REF" --expect-input-issues --out "$RUNNER_TEMP/files"
          python3 dist/cli-source/scripts/verify-files.py --binary "$RUNNER_TEMP/bin/lenso" \
            --official --token-env GITHUB_TOKEN --language "$LANGUAGE" --storage both --upgrade --code-version 0.3.7 --auth-version "$AUTH_MODULE_VERSION" --files-version "$FILES_MODULE_VERSION" --module-ref "$MODULE_SOURCE_REF" --expect-input-issues --out "$RUNNER_TEMP/files-upgrade"
      - name: Verify existing Auth and Files source upgrades
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          python3 dist/cli-source/scripts/verify-files.py --binary "$RUNNER_TEMP/bin/lenso" \
            --official --token-env GITHUB_TOKEN --language "$LANGUAGE" --storage both --upgrade-modules \
            --code-version 0.3.7 --auth-version "$AUTH_MODULE_VERSION" --files-version "$FILES_MODULE_VERSION" \
            --module-ref "$MODULE_SOURCE_REF" --expect-input-issues --out "$RUNNER_TEMP/module-upgrade"
      - name: Record installed registry SDK versions
        run: |
          extra=()
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then extra+=(--module-upgrades); fi
          python3 scripts/record-sdk-consumers.py --root "$RUNNER_TEMP" --language "${{ matrix.language }}" "${extra[@]}" --output "$RUNNER_TEMP/sdk-consumers.json"
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            docker rm -f lenso-module-postgres
          elif [ -n "${LENSO_TEST_PG_BIN:-}" ]; then
            "$LENSO_TEST_PG_BIN/pg_ctl" -D "$LENSO_TEST_PG_DATA" -m fast -w stop
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-module-consumers-${{ runner.os }}-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/sdk-consumers.json
            ${{ runner.temp }}/consumers/*/verification.json
            ${{ runner.temp }}/apps/**/verification.json
            ${{ runner.temp }}/files/**/verification.json
            ${{ runner.temp }}/files-upgrade/**/verification.json
            ${{ runner.temp }}/module-upgrade/**/verification.json
          if-no-files-found: error
