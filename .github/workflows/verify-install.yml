name: Verify official Auth installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, rust]
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: bash scripts/ci-postgres.sh
      - name: Install published CLI
        run: |
          curl -fsSL --retry 2 https://github.com/LioRael/lenso-cli/releases/download/v1.1.2/install.sh -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh" --prefix "$RUNNER_TEMP/lenso-bin"
      - name: Generate and run both native language variants
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-cli.py --binary "$RUNNER_TEMP/lenso-bin/lenso" --official --language "${{ matrix.language }}" --storage both --token-env GITHUB_TOKEN --out "$RUNNER_TEMP/auth-consumers"
      - name: Record official preset SDK consumers
        run: python3 scripts/record-sdk-consumers.py --root "$RUNNER_TEMP/auth-consumers" --language "${{ matrix.language }}" --legacy-preset --output "$RUNNER_TEMP/auth-consumers/sdk-consumers.json"
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ "$RUNNER_OS" = Linux ]; then docker rm -f lenso-module-postgres
          elif [ -n "${LENSO_TEST_PG_BIN:-}" ]; then "$LENSO_TEST_PG_BIN/pg_ctl" -D "$LENSO_TEST_PG_DATA" -m fast -w stop
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auth-generated-consumers-${{ runner.os }}-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/auth-consumers/verification.json
            ${{ runner.temp }}/auth-consumers/sdk-consumers.json
          if-no-files-found: error
