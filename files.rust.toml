schema_version=1
[modules.files]
version="0.1.0"
[modules.files.supports]
language=["rust"]
runtime=["tokio"]
app_host=["lenso-http-v2"]
[modules.files.options.max_bytes]
prompt="Maximum upload bytes"
kind={type="integer",min=1,max=1073741824}
default=52428800
[modules.files.slots.metadata]
contract="lenso.files-metadata"
version="^1"
[modules.files.slots.content]
contract="lenso.blob-store"
version="^1"
[modules.sqlite]
version="0.1.0"
provides={"lenso.files-metadata"={version="1.0.0"}}
[modules.sqlite.options.path]
prompt="Files SQLite database path"
kind={type="text"}
default="files.sqlite"
[modules.postgres]
version="0.1.0"
provides={"lenso.files-metadata"={version="1.0.0"}}
[modules.postgres.options.connection]
prompt="Files PostgreSQL environment binding"
kind={type="environment"}
default={env="DATABASE_URL"}
[modules.local]
version="0.1.0"
provides={"lenso.blob-store"={version="1.0.0"}}
[modules.local.options.directory]
prompt="Local content directory"
kind={type="text"}
default="data/files"
[resources]
files=[{path="rust/src/modules/files/mod.rs",target="mod.rs"}]
local=[{path="rust/src/modules/files/local.rs",target="local.rs"}]
sqlite=[{path="rust/src/modules/files/sqlite.rs",target="store.rs"},{path="rust/src/modules/files/sqlite.sql",target="sqlite.sql"}]
postgres=[{path="rust/src/modules/files/postgres.rs",target="store.rs"},{path="rust/src/modules/files/postgres.sql",target="postgres.sql"}]
[generator]
schema_version=1
directory="generated/files"
files=[{scope="composition",template="templates/rust/files.rs.j2",target="host.rs"},{scope="composition",template="templates/files-host.toml.j2",target="host.toml"}]
[samples.default]
instances={files="files"}
bindings={"files.metadata"={type="module",module="sqlite"}}
context={language="rust",runtime="tokio",app_host="lenso-http-v2"}
[samples.postgres]
instances={files="files"}
bindings={"files.metadata"={type="module",module="postgres"}}
context={language="rust",runtime="tokio",app_host="lenso-http-v2"}

[[generator.dependencies]]
ecosystem="cargo"
package="lenso-app"
version="0.1.1"
module="files"
options={features=["json"]}

[[generator.dependencies]]
ecosystem="cargo"
package="serde"
version="1"
module="files"
options={features=["derive"]}

[[generator.dependencies]]
ecosystem="cargo"
package="serde_json"
version="1"
module="files"
options={}

[[generator.dependencies]]
ecosystem="cargo"
package="sha2"
version="0.10"
module="files"
options={}

[[generator.dependencies]]
ecosystem="cargo"
package="getrandom"
version="0.3"
module="files"
options={}

[[generator.dependencies]]
ecosystem="cargo"
package="axum"
version="0.8"
module="files"
options={}

[[generator.dependencies]]
ecosystem="cargo"
package="tokio"
version="1"
module="files"
options={features=["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"]}

[[generator.dependencies]]
ecosystem="cargo"
package="tokio-util"
version="0.7"
module="files"
options={features=["io"]}

[[generator.dependencies]]
ecosystem="cargo"
package="futures-util"
version="0.3"
module="files"
options={}

[[generator.dependencies]]
ecosystem="cargo"
package="cap-std"
version="4"
module="local"
options={}

[[generator.dependencies]]
ecosystem="cargo"
package="rusqlite"
version="0.42"
module="sqlite"
options={features=["bundled"]}

[[generator.dependencies]]
