[package]
name = "lenso-auth-source"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
lenso-app = { version = "0.1.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
rusqlite = { version = "0.42", features = ["bundled"] }
scrypt = "0.11"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
axum = "0.8"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
